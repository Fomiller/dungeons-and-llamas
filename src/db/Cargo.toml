[package]
name = "db"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
diesel = { version = "2.2.6", features = ["postgres", "serde_json"] }
diesel_migrations = { version = "2.2.0", features = ["postgres"] }
pgvector = { version = "0.4.0", features = ["diesel", "serde"] }
serde = { version = "1.0.216", features = ["serde_derive"] }
