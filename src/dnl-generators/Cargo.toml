[package]
name = "dnl-generators"
version = "0.1.0"
edition = "2021"

[dependencies]
dnl-types = { path = "../dnl-types/" }
dnl-store = { path = "../dnl-store/" }
dnl-sort-keys = { path = "../dnl-sort-keys/" }
