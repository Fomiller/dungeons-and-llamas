aws-sdk-dynamodb = "1.49.0"
lambda_http = "0.13.0"
serde_dynamo = { version = "4.2.14", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.132"
aws-sdk-bedrockruntime = { version = "1.64.0", features = [
    "behavior-version-latest",
] }
