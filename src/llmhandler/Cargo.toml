[package]
name = "llm-handler"
version = "0.1.0"
edition = "2021"

# Starting in Rust 1.62 you can use `cargo add` to add dependencies 
# to your project.
#
# If you're using an older Rust version,
# download cargo-edit(https://github.com/killercup/cargo-edit#installation) 
# to install the `add` subcommand.
#
# Running `cargo add DEPENDENCY_NAME` will
# add the latest version of a dependency to the list,
# and it will keep the alphabetic ordering for you.

[dependencies]
serde_json = "1"
lambda_runtime = "0.13.0"
tokio = { version = "1", features = ["macros"] }
aws-config = "1.5.10"
aws-sdk-bedrock = "1.62.0"
serde = { version = "1.0.215", features = ["derive"] }
aws-sdk-bedrockruntime = { version = "1.61.0", features = [
    "behavior-version-latest",
] }
aws-smithy-types = { version = "1.2.9", features = [
    "serde-deserialize",
    "serde-serialize",
] }
rust-bert = { version = "0.23.0", default-features = false, features = [
    "rustls-tls",
    "cached-path",
    "dirs",
    "lazy_static",
    "remote",
] }
aws-sdk-s3 = "1.65.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
bincode = "1.3.3"
sqlite-vec = "0.1.6"
zerocopy = "0.8.13"
diesel = { version = "2.2.6", features = ["postgres", "serde_json"] }
pgvector = { version = "0.4.0", features = ["diesel"] }
anyhow = "1.0.94"
